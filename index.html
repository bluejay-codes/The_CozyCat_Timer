<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PUT A TITLE IN HERE -->
    <title>This is the demo</title>
    <!-- PUT A DESCRIPTION IN HERE -->
    <meta name="description" content="describe content of the page here...." />
    <!-- LINK TO NORMALIZE (FOR CONSISTENCY) -->
    <link rel="stylesheet" href="styles/normalize.css" />
    <!-- LINK TO ANY FRAMEWORK STYLES HERE-->
    
    <!-- LINK TO YOUR STYLES -->
    <link rel="stylesheet" href="styles/styles.css" />
    <!-- LINK TO EXTERNAL JS LIBRARIES HERE -->
    <!-- LINK TO YOUR JS HERE. NOTE THE DEFER ATTRIBUTE. -->
    <script src="scripts/scripts.js" defer></script>
  </head>
  <body>
    <!-- YOUR HTML GOES HERE -->
    <h1>The Cozy Cat Clock </h1>

    <div class="container">
      <img class="container_image" src="images/Dream 4.gif">
      <div class="options">
        <div class="time">
          <a class="time-selection" href="timer.html">
            <span class="title">Select your Focus Time</span>
          </a>
        </div>

        <div id="timer" class="timer-display">15:00</div>

        <div class="inputs">
          <div class="input-row">
            <label for="task">What is your task?</label>
            <input type="text" id="task">
            <button type="button" id="submit-btn">Submit</button>
          </div>

          <div class="input-row">
            <label for="musicInput">Youtube URL</label>
            <input type="text" id="musicInput">
            <button type="button" id="submit-btn">Submit</button>
          </div>
        </div>

        <audio id="player" src="audio.mp3"></audio>

        <div class="controls">
          <button type="button" id="playBtn" aria-label="Play" aria-pressed="false">
            <img id="playImg" src="images/PLAY.png" alt="Play">
          </button>

          <button type="button" id="PauseBtn" aria-label="Pause" aria-pressed="false">
            <img id="PauseImg" src="images/pause.png" alt="Pause">
          </button>
          <button type="button" id="resetBtn" aria-label="Reset" aria-pressed="false">
            <img id="resetImg" src="images/repeat.png" alt="Reset">
          </button>
        </div>
      </div>
    </div>

    <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
    </div>
    <!-- YOUR EXTERNAL PLUG-IN MAY ASK YOU TO PUT A SCRIPT TAG HERE. -->
  </body>
</html>
