<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose Your Focus Time</title>
    <link rel="stylesheet" href="styles/normalize.css" />
    <link rel="stylesheet" href="styles/styles.css" />
    <script src="scripts/scripts.js" defer></script>
  </head>
  <body>
    <div id="container">
      <h1>Choose your focus time!</h1>
      <div id="timer" class="timer-display">15:00</div>
      <div class="timer">
        <button id="15-btn" type="button" data-minutes="15">15:00</button>
        <button id="30-btn" type="button" data-minutes="30">30:00</button>
        <button id="45-btn" type="button" data-minutes="45">45:00</button>
        <button id="60-btn" type="button" data-minutes="60">60:00</button>
      </div>
      <a class="time-selection" href="index.html">Back to the timer</a>
    </div>
  </body>
</html>
